<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="TicketCoop" />
    <meta name="description" content="TicketCoop IT Support Operations Dashboard" />
    <script>
      (function () {
        var KEY = 'itops-dashboard-theme';
        var value = 'light';

        try {
          var stored = window.localStorage.getItem(KEY);
          if (stored === 'light' || stored === 'dark') {
            value = stored;
          }
        } catch (_) {
          value = 'light';
        }

        document.documentElement.setAttribute('data-theme', value);
        document.documentElement.style.colorScheme = value;
      })();
    </script>
    <title>TicketCoop | IT Support Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
