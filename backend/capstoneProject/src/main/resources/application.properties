spring.application.name=capstoneProject

spring.datasource.url=jdbc:mysql://localhost:3306/it_ticket_management
spring.datasource.username=root
spring.datasource.password=capstone

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
